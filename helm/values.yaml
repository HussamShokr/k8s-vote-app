# Global values
global:
  env: production
  # hostname is required for Ingress, Certificate, and ClusterIssuer to be created.
  # Set this at install time: helm install voting-app . --set global.hostname=minikube.local
  hostname: ""

# Database (PostgreSQL) configuration
db:
  enabled: true
  name: db
  image: postgres:15-alpine
  replicas: 1
  resources:
    requests:
      memory: "256Mi"
      cpu: "250m"
    limits:
      memory: "512Mi"
      cpu: "500m"
  persistence:
    enabled: true
    storageClass: "standard"
    size: 1Gi
    accessMode: ReadWriteOnce
  env:
    POSTGRES_USER: postgres
    POSTGRES_PASSWORD: postgres
    PGDATA: /var/lib/postgresql/data/pgdata
  backup:
    enabled: true
    schedule: "0 1 * * *"  # Daily at 1 AM
    image: bitnami/postgresql:15
    retention: 7  # Days to keep backups
    resources:
      requests:
        memory: "64Mi"
        cpu: "100m"
      limits:
        memory: "128Mi"
        cpu: "200m"
    storage:
      size: 2Gi
      storageClass: "standard"
  restore:
    # Set enabled: true and restoreFile to trigger a one-shot restore Job.
    # After the restore completes, set enabled back to false and upgrade the release.
    enabled: false
    restoreFile: ""  # e.g. "/backups/postgres-20240101-010000.dump"

# Redis configuration
redis:
  enabled: true
  name: redis
  image: redis:alpine
  replicas: 1
  resources:
    requests:
      memory: "64Mi"
      cpu: "250m"
    limits:
      memory: "128Mi"
      cpu: "500m"
  persistence:
    # Redis is a queue buffer — data is drained to PostgreSQL by the worker.
    # Persistence adds PVC overhead with no meaningful benefit; emptyDir is sufficient.
    enabled: false
    storageClass: "standard"
    size: 1Gi
    accessMode: ReadWriteOnce

# Vote frontend configuration
vote:
  enabled: true
  name: vote
  image: kodekloud/examplevotingapp_vote:v1
  replicas: 1
  service:
    type: NodePort
    port: 8080
    targetPort: 80
    nodePort: 31000
  resources:
    requests:
      memory: "64Mi"
      cpu: "250m"
    limits:
      memory: "128Mi"
      cpu: "500m"
  autoscaling:
    enabled: true
    minReplicas: 1
    maxReplicas: 5
    targetCPUUtilizationPercentage: 80
    targetMemoryUtilizationPercentage: 80
  pdb:
    enabled: true
    minAvailable: 1

# Result frontend configuration
result:
  enabled: true
  name: result
  image: kodekloud/examplevotingapp_result:v1
  replicas: 1
  service:
    type: NodePort
    port: 8081
    targetPort: 80
    nodePort: 31001
  resources:
    requests:
      memory: "64Mi"
      cpu: "250m"
    limits:
      memory: "128Mi"
      cpu: "500m"
  autoscaling:
    enabled: true
    minReplicas: 1
    maxReplicas: 5
    targetCPUUtilizationPercentage: 80
    targetMemoryUtilizationPercentage: 80
  pdb:
    enabled: true
    minAvailable: 1

# Worker backend configuration
worker:
  enabled: true
  name: worker
  image: kodekloud/examplevotingapp_worker:v2
  replicas: 1
  resources:
    requests:
      memory: "256Mi"
      cpu: "250m"
    limits:
      memory: "512Mi"
      cpu: "500m"
  autoscaling:
    enabled: true
    minReplicas: 1
    maxReplicas: 5
    targetCPUUtilizationPercentage: 80
    targetMemoryUtilizationPercentage: 80
  pdb:
    enabled: true
    minAvailable: 1
  canary:
    enabled: true
    image: kodekloud/examplevotingapp_worker:v2
    replicas: 1
    weight: 20  # Percentage of traffic to route to canary

# Network Policies
networkPolicies:
  enabled: true
# Ingress Configuration
ingress:
  enabled: true
  name: voting-app-ingress
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/rewrite-target: /$2
  paths:
    vote: /vote(/|$)(.*)
    result: /result(/|$)(.*)


# Certificate Management
certificate:
  enabled: true
  name: voting-app-tls
  secretName: voting-app-tls
  duration: 2160h  # 90 days
  renewBefore: 360h  # 15 days
  organization: "Voting App"
  wildcardDomain: true

# Cluster Issuer for self-signed certificates
clusterIssuer:
  enabled: true
  name: selfsigned-issuer

# Cert Manager configuration
# The tarball is already bundled in charts/ — no separate install needed.
certManager:
  enabled: true

# Values passed directly to the cert-manager sub-chart (key must match chart name exactly)
cert-manager:
  installCRDs: true

# Monitoring configuration (Prometheus + Grafana via kube-prometheus-stack)
# Disabled by default — requires Minikube with at least 4 CPUs and 6GB RAM.
# Enable with: helm upgrade voting-app . --set monitoring.enabled=true --set monitoring.lokiEnabled=true
monitoring:
  enabled: false
  lokiEnabled: false

# kube-prometheus-stack sub-chart values
kube-prometheus-stack:
  grafana:
    enabled: true
    adminPassword: prom-operator
    ingress:
      enabled: false  # Grafana is exposed via the main ingress below if needed
    grafana.ini:
      server:
        root_url: "%(protocol)s://%(domain)s/grafana"
        serve_from_sub_path: true
  prometheus:
    prometheusSpec:
      serviceMonitorSelectorNilUsesHelmValues: false
      podMonitorSelectorNilUsesHelmValues: false
  alertmanager:
    enabled: true

# loki-stack sub-chart values
loki-stack:
  loki:
    enabled: true
    isDefault: false
  promtail:
    enabled: true
  grafana:
    enabled: false  # Use the grafana from kube-prometheus-stack