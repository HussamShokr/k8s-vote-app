{{- if .Values.networkPolicies.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: backend-worker-policy
spec:
  podSelector:
    matchLabels:
      app: {{ .Values.worker.name }}
  ingress:
  # No direct ingress needed — worker pulls from Redis
  egress:
  # Allow egress to PostgreSQL
  - to:
    - podSelector:
        matchLabels:
          app: {{ .Values.db.name }}
    ports:
    - protocol: TCP
      port: 5432
  # Allow egress to Redis
  - to:
    - podSelector:
        matchLabels:
          app: {{ .Values.redis.name }}
    ports:
    - protocol: TCP
      port: 6379
  # Allow DNS resolution
  - ports:
    - protocol: UDP
      port: 53
{{- end }}
