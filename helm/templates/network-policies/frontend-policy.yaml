{{- if .Values.networkPolicies.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: frontend-vote-policy
spec:
  podSelector:
    matchLabels:
      app: {{ .Values.vote.name }}
  ingress:
  # Allow ingress from anywhere (public access via ingress controller)
  - {}
  egress:
  # Allow egress only to Redis
  - to:
    - podSelector:
        matchLabels:
          app: {{ .Values.redis.name }}
    ports:
    - protocol: TCP
      port: 6379
  # Allow DNS resolution
  - ports:
    - protocol: UDP
      port: 53

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: frontend-result-policy
spec:
  podSelector:
    matchLabels:
      app: {{ .Values.result.name }}
  ingress:
  # Allow ingress from anywhere (public access via ingress controller)
  - {}
  egress:
  # Allow egress only to PostgreSQL
  - to:
    - podSelector:
        matchLabels:
          app: {{ .Values.db.name }}
    ports:
    - protocol: TCP
      port: 5432
  # Allow DNS resolution
  - ports:
    - protocol: UDP
      port: 53
{{- end }}
