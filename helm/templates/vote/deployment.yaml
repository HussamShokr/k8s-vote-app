{{- if .Values.vote.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.vote.name }}
  labels:
    {{- include "voting-app.vote.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.vote.replicas }}
  minReadySeconds: 10
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      {{- include "voting-app.vote.labels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "voting-app.vote.labels" . | nindent 8 }}
    spec:
      containers:
      - name: vote
        image: {{ .Values.vote.image }}
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 80
          name: vote
        resources:
          {{- toYaml .Values.vote.resources | nindent 10 }}
        lifecycle:
          preStop:
            exec:
              # Allow load balancer to drain connections before the pod stops
              command: ["/bin/sh", "-c", "sleep 5"]
        readinessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 5
          failureThreshold: 3
        livenessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 15
          periodSeconds: 10
          failureThreshold: 3
{{- end }}
