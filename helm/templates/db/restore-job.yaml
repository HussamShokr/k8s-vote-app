{{- if and .Values.db.enabled .Values.db.restore.enabled }}
# Restore job: set db.restore.enabled=true and db.restore.restoreFile to the backup path,
# then run `helm upgrade`. After restore completes, set enabled back to false.
apiVersion: batch/v1
kind: Job
metadata:
  name: db-restore
  labels:
    {{- include "voting-app.db.labels" . | nindent 4 }}
    app.kubernetes.io/component: restore
spec:
  backoffLimit: 3
  template:
    spec:
      securityContext:
        runAsUser: 0
        fsGroup: 0
      containers:
      - name: restore
        image: {{ .Values.db.backup.image }}
        command:
        - /bin/bash
        - -c
        - |
          BACKUP_FILE="{{ .Values.db.restore.restoreFile }}"

          if [ -z "$BACKUP_FILE" ]; then
            echo "ERROR: db.restore.restoreFile is not set."
            echo "Available backups:"
            ls -la /backups
            exit 1
          fi

          if [ ! -f "$BACKUP_FILE" ]; then
            echo "ERROR: Backup file $BACKUP_FILE not found."
            echo "Available backups:"
            ls -la /backups
            exit 1
          fi

          echo "Terminating existing connections to postgres database..."
          psql -h {{ .Values.db.name }} -U {{ .Values.db.env.POSTGRES_USER }} \
            -c "SELECT pg_terminate_backend(pid) FROM pg_stat_activity WHERE datname='postgres' AND pid <> pg_backend_pid();"

          echo "Restoring from: $BACKUP_FILE"
          pg_restore -h {{ .Values.db.name }} -U {{ .Values.db.env.POSTGRES_USER }} \
            -d postgres -c -C "$BACKUP_FILE"

          echo "Restore complete."
        env:
        - name: PGPASSWORD
          valueFrom:
            secretKeyRef:
              name: {{ .Values.db.name }}-secret
              key: postgres-password
        resources:
          {{- toYaml .Values.db.backup.resources | nindent 10 }}
        volumeMounts:
        - name: backup-storage
          mountPath: /backups
      volumes:
      - name: backup-storage
        persistentVolumeClaim:
          claimName: {{ .Values.db.name }}-backup-pvc
      restartPolicy: OnFailure
{{- end }}
