{{- if .Values.db.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.db.name }}-secret
  labels:
    {{- include "voting-app.db.labels" . | nindent 4 }}
type: Opaque
stringData:
  postgres-password: {{ .Values.db.env.POSTGRES_PASSWORD | quote }}
  postgres-user: {{ .Values.db.env.POSTGRES_USER | quote }}
{{- end }}
