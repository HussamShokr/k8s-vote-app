apiVersion: v2
name: voting-app
description: A Helm chart for deploying a multi-tier voting application with Ingress, auto-renewing SSL, monitoring, and logging
type: application
version: 0.1.0
appVersion: "1.0.0"
keywords:
  - voting
  - multi-tier
maintainers:
  - name: Admin
    email: admin@example.com
dependencies:
  - name: cert-manager
    version: ~1.13.2
    repository: https://charts.jetstack.io
    condition: certManager.enabled
  - name: kube-prometheus-stack
    version: "70.4.1"
    repository: https://prometheus-community.github.io/helm-charts
    condition: monitoring.enabled
  - name: loki-stack
    version: "2.10.2"
    repository: https://grafana.github.io/helm-charts
    condition: monitoring.lokiEnabled
